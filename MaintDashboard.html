<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dashboard - Maintenance</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h1>MakerspaceHub</h1>
        <ul class="nav-menu">
          <li><a class="nav-link" href="index.html" id="logoutLink">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main class="pageLayout">
      <h2>Maintenance Tickets</h2>
      <table class="data-table">
        <thead><tr><th>Ticket</th><th>Equipment</th><th>Assigned</th><th>Priority</th><th>Status</th><th>Created</th><th>Updated</th></tr></thead>
        <tbody id="tickets"></tbody>
      </table>

      <select class="EquipmentSelect" id="eqFilter" aria-label="Filter history by equipment"></select>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Ticket</th><th>Assigned</th><th>Status</th><th>Notes</th></tr></thead>
        <tbody id="history"></tbody>
      </table>

      <form class="form-grid ticket-form" id="updateForm">
        <h2>Maintenance Ticket Update</h2>
        <label for="ticket">Ticket:</label>
        <select id="ticket" required></select>
        <label for="status">Status:</label>
        <select id="status"><option>In Progress</option><option>Completed</option></select>
        <label for="notes">Notes:</label>
        <textarea id="notes" rows="4"></textarea>
        <p class="error" id="msg" role="alert"></p>
        <button class="linkButton" type="submit">Update Ticket</button>
      </form>
    </main>
    <script src="equipment.js"></script>
    <script src="maint.js"></script>
    <script src="logout.js"></script>
  </body>
</html>
