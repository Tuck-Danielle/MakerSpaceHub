<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dashboard - Staff</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <h1>MakerspaceHub</h1>
        <ul class="nav-menu">
          <li><a class="nav-link" href="#" id="resetLink">Reset demo data</a></li>
          <li><a class="nav-link" href="index.html" id="logoutLink">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main class="pageLayout">
      <section class="top-row">
        <div class="alert-box" id="alerts"></div>

        <form class="form-grid inventory-form" id="invForm">
          <h2>Update Inventory Counts</h2>
          <label for="item">Item:</label>
          <select id="item" required></select>
          <label for="action">Add/Subtract:</label>
          <select id="action"><option value="1">Add</option><option value="-1">Subtract</option></select>
          <label for="qty">Quantity:</label>
          <input type="number" id="qty" min="0.01" step="0.01" required />
          <p class="error" id="invMsg" role="alert"></p>
          <button class="linkButton" type="submit">Update</button>
        </form>
      </section>

      <table class="data-table">
        <thead><tr><th>Consumable</th><th>Description</th><th>Stock</th><th>Low Threshold</th></tr></thead>
        <tbody id="invRows"></tbody>
      </table>

      <form class="form-grid ticket-form" id="ticketForm">
        <h2>Maintenance Tickets</h2>
        <label for="equipment">Equipment:</label>
        <select id="equipment" required></select>
        <label for="reason">Reason for Ticket:</label>
        <textarea id="reason" rows="4" required></textarea>
        <label for="priority">Priority:</label>
        <select id="priority"><option>Low</option><option>Medium</option><option>High</option></select>
        <p class="error" id="msg" role="alert"></p>
        <button class="linkButton" type="submit">Submit Ticket</button>
      </form>

      <table class="data-table">
        <thead><tr><th>Equipment</th><th>Description</th><th>Category</th><th>Status</th></tr></thead>
        <tbody id="eqRows"></tbody>
      </table>
    </main>
    <script src="store.js"></script>
    <script src="staff.js"></script>
    <script src="logout.js"></script>
  </body>
</html>
