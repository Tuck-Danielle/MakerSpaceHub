<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MakerspaceHub - Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="pageForm">
      <h1>MakerspaceHub</h1>

      <form action="/login" method="post">
        <!-- Username -->
        <input type="text" name="username" placeholder="Username" />
        <!-- Password -->
        <input type="password" name="password" placeholder="Password" />

        <!-- Pretends to submit the form, doesn't actually verify -->
        <a class="linkButton" href="StudentDashboard.html">Login</a>
      </form>

      <div
        class="welcomeimg"
        role="img"
        aria-label="Makerspace image placeholder"
      >
        <img class="welcomeimg" src="Welcome.jpg" />
      </div>
    </main>
  </body>
</html>
