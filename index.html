<!DOCTYPE html>
<html lang="en">
  <head>
    <title>MakerspaceHub - Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    
  </head>

  <body>
    <main class="pageForm">
      <h1>MakerspaceHub</h1>

      <form id="loginForm">
        <!-- Username -->
        <input type="text" id="username" name="username" placeholder="Username" required/>
        <!-- Password -->
        <input type="password" id="password" name="password" placeholder="Password" required/>
        <p class="error" id="loginError" role="alert"></p>
        <!-- Submits the form -->
        <button class="linkButton" type="submit">Login</button>
      </form>
      
      <script src="login.js"></script>

      <div
        class="welcomeimg"
        role="img"
        aria-label="Makerspace image placeholder"
      >
        <img class="welcomeimg" src="Welcome.jpg" />
      </div>
    </main>
  </body>
</html>
